name: VitaScan CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pydantic fastapi httpx pillow torch torchvision scikit-learn xgboost
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Lint Backend with Ruff
        run: |
          ruff check backend/

      - name: Run Pytest on Backend
        run: |
          pytest backend/

  schema-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate Pydantic Models against JSON Schemas
        run: |
          pip install pydantic pytest
          pytest backend/shared/test_schemas.py

  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint --if-present

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
